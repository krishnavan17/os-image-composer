  kernel:
    version: "6.17"
    cmdline: "xe.max_vfs=7 xe.force_probe=* modprobe.blacklist=i915 udmabuf.list_limit=8192 console=ttyS0,115200 console=tty0 loglevel=7"
    packages:
      - linux-image-generic-hwe-24.04

  configurations:
    # Update kernel GRUB
    - cmd: "update-grub"
    - cmd: |-
        bash -lc '
          set -euo pipefail
          GPU_DRIVER_VERSION="25.27.34303.5"
          IGC_VERSION="2.14.1"
          SCRIPT_DIR="/opt"
          DRIVER_DIR="${SCRIPT_DIR}/gpu/${GPU_DRIVER_VERSION}"
          mkdir -p "${DRIVER_DIR}"
          cd "${DRIVER_DIR}"

          echo ""
          echo "[ Info ] Downloading GPU driver packages..."

          packages=(
            "https://github.com/intel/intel-graphics-compiler/releases/download/v${IGC_VERSION}/intel-igc-core-2_${IGC_VERSION}+19448_amd64.deb"
            "https://github.com/intel/intel-graphics-compiler/releases/download/v${IGC_VERSION}/intel-igc-opencl-2_${IGC_VERSION}+19448_amd64.deb"
            "https://github.com/intel/compute-runtime/releases/download/${GPU_DRIVER_VERSION}/intel-ocloc-dbgsym_${GPU_DRIVER_VERSION}-0_amd64.ddeb"
            "https://github.com/intel/compute-runtime/releases/download/${GPU_DRIVER_VERSION}/intel-ocloc_${GPU_DRIVER_VERSION}-0_amd64.deb"
            "https://github.com/intel/compute-runtime/releases/download/${GPU_DRIVER_VERSION}/intel-opencl-icd-dbgsym_${GPU_DRIVER_VERSION}-0_amd64.ddeb"
            "https://github.com/intel/compute-runtime/releases/download/${GPU_DRIVER_VERSION}/intel-opencl-icd_${GPU_DRIVER_VERSION}-0_amd64.deb"
            "https://github.com/intel/compute-runtime/releases/download/${GPU_DRIVER_VERSION}/libigdgmm12_22.7.2_amd64.deb"
            "https://github.com/intel/compute-runtime/releases/download/${GPU_DRIVER_VERSION}/libze-intel-gpu1-dbgsym_${GPU_DRIVER_VERSION}-0_amd64.ddeb"
            "https://github.com/intel/compute-runtime/releases/download/${GPU_DRIVER_VERSION}/libze-intel-gpu1_${GPU_DRIVER_VERSION}-0_amd64.deb"
          )

          for url in "${packages[@]}"; do
            filename="$(basename "${url}")"
            if [ -f "${filename}" ]; then
              echo "[ Info ] ${filename} already downloaded, skipping"
            else
              wget -q --show-progress "${url}"
            fi
          done
        '
    - cmd: |-
        bash -lc '
          set -euo pipefail
          GPU_DRIVER_VERSION="25.27.34303.5"
          SCRIPT_DIR="/opt"
          DRIVER_DIR="${SCRIPT_DIR}/gpu/${GPU_DRIVER_VERSION}"
          cd "${DRIVER_DIR}"

          echo ""
          echo "[ Info ] Installing GPU driver packages..."
          sudo dpkg -i ./*.deb 2>/dev/null || sudo apt-get install -f -y -qq
        '
    - cmd: "python3 -m venv /opt/act"
    - cmd: "bash -lc 'source /opt/act/bin/activate'"
    - cmd: "/opt/act/bin/pip install torch==2.3.1+cxx11.abi torchvision==0.18.1+cxx11.abi torchaudio==2.3.1+cxx11.abi intel-extension-for-pytorch==2.3.110+xpu oneccl_bind_pt==2.3.100+xpu ipex-llm==2.2.0b20241224 --extra-index-url https://pytorch-extension.intel.com/release-whl/stable/xpu/us/"
    - cmd: "/opt/act/bin/pip install openvino==2024.6.0"
    - cmd: "/opt/act/bin/pip install pyquaternion==0.9.9 pyyaml==6.0 rospkg==1.5.0 pexpect==4.8.0 mujoco==3.2.6 dm_control==1.0.26 matplotlib==3.10.0 einops==0.6.0 packaging==23.0 h5py==3.12.1 ipython==8.12.0 opencv-python==4.10.0.84 transformers==4.37.0 accelerate==0.23.0 bigdl-core-xe-21==2.6.0b2 bigdl-core-xe-addons-21==2.6.0b2 bigdl-core-xe-batch-21==2.6.0b2 huggingface-hub==0.24.7 torchvision torch pyquaternion pyyaml rospkg pexpect mujoco==2.3.7 dm_control==1.0.14 opencv-python matplotlib einops packaging h5py ipython"
    - cmd: "git clone https://github.com/tonyzhaozh/act.git /opt/act"
    - cmd: "git clone https://github.com/open-edge-platform/edge-ai-suites.git /opt/edge-ai-suites"
    - cmd: "bash -lc 'cd /opt/act'"
    - cmd: "bash -lc 'cd /opt/act && git am /opt/robotics-ai-suite/pipelines/act-sample/patches/ov'"
    - cmd: "bash -lc 'cd /opt/act && git am /opt/robotics-ai-suite/pipelines/act-sample/patches/ipex'"
    - cmd: "/opt/act/bin/pip install -e /opt/act/detr"
    - cmd: "mkdir -p /opt/act-model"
    - cmd: "wget https://eci.intel.com/embodied-sdk-docs/_downloads/sim_insertion_scripted.zip -P /opt/act-model"
    - cmd: "unzip -o /opt/act-model/sim_insertion_scripted.zip -d /opt/act-model"

  