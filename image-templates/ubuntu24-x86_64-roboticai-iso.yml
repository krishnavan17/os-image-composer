# AI-searchable metadata for template discovery
metadata:
  description: Ubuntu 24.04 bootable ISO image for Robotics AI use cases
  use_cases:
    - Creating bootable installation media
    - Minimal Ubuntu installation for robotics and AI applications
    - Action chucking transformer workload
  keywords:
    - iso
    - bootable
    - installation
    - usb
    - dvd
    - minimal
    - ubuntu

image:
  name: ubuntu-robotics-ai-act
  version: "24.04"

target:
  os: ubuntu
  dist: ubuntu24
  arch: x86_64
  imageType: iso # Image type, valid value: [raw, iso].

packageRepositories:

  - codename: "sed"
    url: "https://eci.intel.com/sed-repos/noble"
    pkey: "https://eci.intel.com/sed-repos/gpg-keys/GPG-PUB-KEY-INTEL-SED.gpg"
    component: "main"

  - codename: "noble"
    url: "http://packages.ros.org/ros2/ubuntu"
    pkey: "https://raw.githubusercontent.com/ros/rosdistro/master/ros.key"
    # pkey: "[trusted=yes]"
    component: "main"

  - codename: "ubuntu24"
    url: "https://apt.repos.intel.com/openvino/2025"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "main"

  - codename: "noble"
    url: "https://download.01.org/intel-linux-overlay/ubuntu/"
    pkey: "https://download.01.org/intel-linux-overlay/ubuntu/E6FA98203588250569758E97D176E3162086EE4C.gpg"
    component: "kernels"

  - codename: "ubuntu24"
    url: "https://apt.repos.intel.com/edgeai/dlstreamer/ubuntu24"
    pkey: "https://apt.repos.intel.com/edgeai/dlstreamer/GPG-PUB-KEY-INTEL-DLS.gpg"

  - codename: "noble"
    url: "https://repositories.intel.com/gpu/ubuntu"
    pkey: "https://repositories.intel.com/gpu/intel-graphics.key"
    component: "unified"

  - codename: "all"
    url: "https://apt.repos.intel.com/oneapi"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "main"


